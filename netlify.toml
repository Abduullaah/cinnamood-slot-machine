# A folder of static files. Nothing to build, and deliberately NO functions:
# every function call costs Netlify credits, and this machine has to run an
# event on a fixed allowance. The iPad posts guests straight to the Google
# Sheet instead, which is free and has nothing to do with Netlify.
[build]
  publish = "site"

# NOTHING here is fingerprinted — shared/config.js keeps its name from one
# deploy to the next — so nothing may be cached without revalidating.
#
# This briefly carried a seven-day max-age to save requests. It cost far more
# than it saved: turning testing mode off and deploying it left the iPad happily
# running the week-old file, and no amount of reloading or clearing the app's
# own cache reached past the browser's. A fix could not have been pushed before
# the event at all.
#
# "no-cache" does not mean "do not store" — the browser keeps the file and asks
# whether it changed. Unchanged files come back as an empty 304, so this is
# nearly free, and the offline copy in sw.js is what actually keeps requests
# down and the machine running without wifi.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
